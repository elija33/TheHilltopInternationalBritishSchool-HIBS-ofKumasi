openapi: 3.0.3
info:
  title: HIBS Portal API
  version: 1.0.0
  description: Minimal OpenAPI spec for core portal operations (terms, attendance, grades, payments).
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: OK
  /session:
    get:
      summary: Get current session and permissions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: session
  /terms/current:
    get:
      summary: Current term
      responses:
        "200":
          description: current term
  /attendance/batch:
    post:
      summary: Submit attendance batch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                term_id:
                  type: string
                class_id:
                  type: string
                date:
                  type: string
                  format: date
                period:
                  type: integer
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      student_id:
                        type: string
                      status:
                        type: string
      responses:
        "200":
          description: batch result
        "400":
          description: validation error
  /assessments:
    post:
      summary: Create assessment
      security:
        - bearerAuth: []
  /assessments/{id}/grades/batch:
    post:
      summary: Submit grades batch (append-only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      student_id:
                        type: string
                      value:
                        type: number
                      status:
                        type: string
      responses:
        "200":
          description: appended
        "423":
          description: term locked (published)
  /terms/{id}/publish:
    post:
      summary: Publish term results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: published
        "409":
          description: publish conflict
  /payments:
    post:
      summary: Create payment (gateway or offline)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invoice_id:
                  type: string
                amount:
                  type: number
                method:
                  type: string
                external_txn_id:
                  type: string
      responses:
        "200":
          description: payment recorded
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
